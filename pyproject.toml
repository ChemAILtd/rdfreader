[project]
name = "rdfreader"
version = "1.0.5"
description = "Read the full contents of CTAB .rdf files in python. Captures RXN and MOL record using RDKit and reads additional data fields (including solvents/catalysts/agents)."
authors = [{ name = "ChemAI Ltd.", email = "enquiries@chemai.io" }]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
keywords = ["chemistry", "rdkit", "rdf", "rxn", "mol", "reaction", "molecule", "reader", "parser", "chemai", "ctab", "cheminformatics"]
requires-python = ">=3.11,<4.0"
dependencies = [
    # 2025.9.3 doesn't build, see 9d652a8
    "rdkit>=2023.9,!=2025.9.3",
]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://chemai.io"
Repository = "https://github.com/ChemAILtd/rdfreader/"

[tool.poetry]
classifiers = [
    "Topic :: Scientific/Engineering :: Chemistry",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pre-commit = "^4.6.2"
pytest-mock = "^3.15.1"
sphinx = "^7.4.7"
coverage = "^7.15.4"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10"

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"
